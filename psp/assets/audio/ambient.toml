# Эмбиент-петли регионов (GDD §1.6: звук без музыки — только эмбиент и генеративные тона).
# Компилируется в build/assets/amb_<имя>.pcm: tools/soundgen.py build/assets
# Формат вывода: сырой PCM, моно, 16 бит со знаком, little-endian, 22 050 Гц, без заголовка.
# Имя региона = имя палитры в assets/palettes.toml, чтобы уровень выбирал петлю по палитре.
#
# Сэмплированного материала нет: всё синтезируется из шума, резонансов и медленных
# огибающих. Петля обязана зацикливаться без щелчка, поэтому каждый слой укладывается
# в петлю целым числом периодов (см. заголовок tools/soundgen.py) — кроссфейд не нужен.
#
# Обязательные поля региона:
#   seconds  длительность петли, 4–8 с (жёсткая проверка в генераторе)
#   seed     зерно ГПСЧ; при том же зерне вывод побайтово тот же
#   peak     целевой пик готовой петли, доля от максимума int16 (предел 0,8)
#
# Виды слоёв (`kind`) и их параметры (все частоты в герцах, уровни — доли):
#   noise   окрашенный шум: tilt (1 розовый, 2 коричневый — наклон по мощности),
#           low/high границы полосы, gust_hz/gust_depth — медленные порывы
#   band    узкополосный резонанс: freq, q (добротность), drift_hz/drift_depth — уход уровня
#   tone    тон: freq, harmonics (уровни гармоник от первой), detune (второй голос
#           для биений), trem_hz/trem_depth — тремоло
#   drops   редкие затухающие синусоиды (капли, стеклянные щелчки): count, freq_lo,
#           freq_hi, decay, glide (уход частоты за событие: + вверх, − вниз), attack
#   rustle  короткие полосовые всплески шума (шорохи): count, dur, low, high
# У каждого слоя есть gain — вклад в смесь до итоговой нормировки по peak.

[defaults]
rate = 22050      # частота файла; микшер играет её на 44 100 Гц с шагом 0,5 (core/audio.h)
seconds = 6.0
peak = 0.60

# ── Веко (хаб): ветер и дальний гул ───────────────────────────────────────────
[hub]
seconds = 7.0
seed = 20260922
peak = 0.58

[[hub.layer]]
kind = "noise"          # ветер: широкая полоса с медленными порывами
gain = 1.00
tilt = 1.3
low = 150.0
high = 5000.0
gust_hz = 0.17
gust_depth = 0.65

[[hub.layer]]
kind = "noise"          # дальний низкий рокот под ветром
gain = 0.55
tilt = 2.0
low = 45.0
high = 260.0
gust_hz = 0.07
gust_depth = 0.35

[[hub.layer]]
kind = "band"           # гул механизма где-то за туманом
gain = 0.30
freq = 128.0
q = 9.0
drift_hz = 0.05
drift_depth = 0.40

[[hub.layer]]
kind = "tone"           # педаль: почти неслышный тон с биениями
gain = 0.18
freq = 55.0
harmonics = [1.0, 0.35]
detune = 0.40
trem_hz = 0.09
trem_depth = 0.30

# ── Сад Зеркал: высокий стеклянный звон ───────────────────────────────────────
[mirrors]
seconds = 6.0
seed = 20260923
peak = 0.55

[[mirrors.layer]]
kind = "noise"          # воздух: только верх спектра, чтобы не спорить со звоном
gain = 0.35
tilt = 1.0
low = 400.0
high = 8000.0
gust_hz = 0.20
gust_depth = 0.40

[[mirrors.layer]]
kind = "noise"          # тихий низ: пол комнаты под звоном
gain = 0.12
tilt = 1.8
low = 80.0
high = 400.0
gust_hz = 0.06
gust_depth = 0.25

[[mirrors.layer]]
kind = "band"           # основной звон (ля второй октавы)
gain = 1.00
freq = 1760.0
q = 45.0
drift_hz = 0.11
drift_depth = 0.60

[[mirrors.layer]]
kind = "band"           # квинта сверху
gain = 0.70
freq = 2637.0
q = 60.0
drift_hz = 0.08
drift_depth = 0.55

[[mirrors.layer]]
kind = "band"           # октава: тонкий блеск
gain = 0.45
freq = 3520.0
q = 70.0
drift_hz = 0.13
drift_depth = 0.50

[[mirrors.layer]]
kind = "band"           # нижняя октава держит аккорд
gain = 0.35
freq = 880.0
q = 30.0
drift_hz = 0.06
drift_depth = 0.45

[[mirrors.layer]]
kind = "drops"          # редкие щелчки стекла
gain = 0.50
count = 5
freq_lo = 2200.0
freq_hi = 4400.0
decay = 0.45
glide = -0.02
attack = 0.001

# ── Часовые Террасы: ровный механический гул ─────────────────────────────────
[terraces]
seconds = 8.0
seed = 20260924
peak = 0.62

[[terraces.layer]]
kind = "tone"           # вал: низкий тон с гармониками, почти без качания.
                        # Строй 62 Гц, вес на второй гармонике: динамик PSP ниже
                        # ~100 Гц почти ничего не отдаёт, а гул слышен должен быть.
gain = 1.00
freq = 62.0
harmonics = [0.75, 1.00, 0.55, 0.30, 0.15]
detune = 0.25
trem_hz = 0.05
trem_depth = 0.12

[[terraces.layer]]
kind = "band"           # резонанс корпуса
gain = 0.40
freq = 192.0
q = 14.0
drift_hz = 0.03
drift_depth = 0.15

[[terraces.layer]]
kind = "band"           # вторая форманта
gain = 0.22
freq = 384.0
q = 20.0
drift_hz = 0.04
drift_depth = 0.15

[[terraces.layer]]
kind = "noise"          # ровный шум подшипников
gain = 0.45
tilt = 1.8
low = 80.0
high = 2200.0
gust_hz = 0.05
gust_depth = 0.12

[[terraces.layer]]
kind = "noise"          # сухое шипение воздуховода
gain = 0.10
tilt = 0.8
low = 2500.0
high = 7000.0
gust_hz = 0.09
gust_depth = 0.20

