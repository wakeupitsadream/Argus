# Типы сущностей уровней — единственный источник числовых кодов ENT_*.
#
# ВАЖНО: порядок строк задаёт значения кодов (types[0] = ENT_NONE = 0, types[1] = 1, ...).
# Уже собранные .lvl хранят числа, поэтому переставлять и удалять типы нельзя —
# добавлять только в конец списка. tools/levelc.py --headers превращает список
# в entity_types.h (enum ENT_* + entity_type_name()).

types = [
    "NONE",          # 0  пусто/заглушка, в уровнях не встречается
    "SPAWN",         # 1  точка входа (цель портала)
    "ECHO",          # 2  отголосок-NPC с репликой
    "SMALL_EYE",     # 3  малый глаз (коллекционный)
    "BIG_EYE",       # 4  большой глаз региона
    "STONE_TEXT",    # 5  камень с надписью
    "EMITTER",       # 6  источник луча
    "MIRROR",        # 7  зеркало, поворот 0..3
    "PRISM",         # 8  призма, делит луч
    "RECEIVER",      # 9  приёмник луча
    "SLEEP_WALL",    # 10 спящая стена: прозрачна для луча под взглядом
    "LEVER",         # 11 рычаг
    "PLATE",         # 12 нажимная плита
    "BLOCK",         # 13 толкаемый блок
    "DOOR",          # 14 дверь/ворота
    "SEGMENT",       # 15 вращающийся сегмент геометрии
    "WATER_VALVE",   # 16 шлюз: меняет уровень воды
    "FLOAT_BLOCK",   # 17 плавучий блок
    "MEMORY_PANEL",  # 18 панель памяти
    "SLEEPER",       # 19 движется только вне взгляда
    "TRIGGER",       # 20 невидимый триггер области
    "FEATHER",       # 21 перо (награда мини-квеста)
    "PLINTH",        # 22 постамент
    "PEACOCK_TAIL",  # 23 павлиний хвост — индикатор прогресса на хабе
]
