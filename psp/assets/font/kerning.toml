# Ручной кернинг шрифтового атласа. Таблица НЕОБЯЗАТЕЛЬНА: секции и списки pairs
# могут быть пустыми (kern_count = 0 в font.bin) — Inter и так сносно расставляет
# пробелы, правки нужны только там, где на глаз видна дырка.
#
# Секции — по индексам гарнитур: [body] — гарнитура 0 (корпусная, 15 px),
# [title] — гарнитура 1 (заголовочная, 30 px).
# Пара: ["первый", "второй", dx], dx — поправка шага пера в пикселях (int8,
# отрицательная сжимает). В font.bin пары пишутся индексами глифов, отсортированными
# по (first << 16 | second); символы вне набора атласа пропускаются с предупреждением.

[body]
pairs = []

[title]
pairs = [
    ["А", "У", -1],
    ["Г", "У", -1],
]
