# Палитры регионов. Цвета — "#rrggbb". Слоты: 0 верх, 1 верх-вариант, 2 стены, 3 акцент,
# 4 тень, 5 свечение глаза, 6 вода, 7 запас. Туман — в цвет sky_bottom; fog_near/fog_far —
# смещения глубины относительно цели камеры (0 = плоскость острова, минус — ближе к камере).
# Рецепт, общий для всех регионов (светлота по Rec.601 после затенения из core/mesh.c):
#   верх ≈ 230, верх-вариант ≈ 200, стена на свету ≈ 70, стена в тени ≈ 55 — разрыв ≥ 4×.
# Верх почти белый и тёплый, вариант верха холоднее: плита читается как один материал,
# а ступени и мосты — как другой. Стены — глубокий холодный тон: тёплый свет, холодная тень.
# Акцента в кадре мало: он достаётся только Око, перьям, глазам и механизмам.
# Туман начинается ЗА плоскостью камеры (fog_near > 0): передний план держит полный
# контраст, растворяется только дальняя половина острова.
# Компилируется в build/assets/palettes.pal (tools/mkassets.py).

[hub]
# Веко: сумерки. Небо — глубокий индиго вверху и пыльная роза у горизонта (он же цвет тумана).
# Камень не белый, а тёплый песчаник: белая плита читается как пенопласт, а песчаник —
# как камень. Верх-вариант холоднее и темнее: ступени отделяются от плиты без линий.
# Стены — тёмная слива; в тень уходит индиго (slots[4]), его подмешивает core/mesh.c.
# Золото носят только Око, хвост, глаза и механизмы — его в кадре должно быть мало.
sky_top    = "#0b1230"
sky_bottom = "#9e8a94"
fog_near   = 2.0
fog_far    = 22.0
slots = ["#ecdcbc", "#cabfad", "#5c4760", "#ffb03a", "#221d3a", "#fff0c6", "#68a0c2", "#c4707c"]

[mirrors]
# Сад Зеркал: закатное тепло. Камень — розовый песчаник, стены — тёмная слива,
# акцент тот же золотой: это цвет луча, и он должен читаться как источник.
sky_top    = "#2a1233"
sky_bottom = "#c07a63"
fog_near   = 2.0
fog_far    = 24.0
slots = ["#f0dcc2", "#d2b9a6", "#68405f", "#ffcb5c", "#2e1b3d", "#fff3d2", "#7fb2c9", "#e07a8a"]

[terraces]
# Часовые Террасы: холодное утро. Камень серо-зелёный, стены — сталь, акцент — латунь
# на механизмах. Здесь всё про движение, поэтому цвет спокойный, а свет резкий.
sky_top    = "#0d2138"
sky_bottom = "#9aa8a6"
fog_near   = 2.0
fog_far    = 26.0
slots = ["#e4e6dc", "#c3c8bd", "#4e5a60", "#e8b14a", "#232f44", "#fdf3cf", "#79a8bf", "#c2766b"]

[water]
# Тихая Вода: бирюза и песок. Вода — единственный насыщенный цвет региона,
# поэтому слот воды яркий, а камень выцветший.
sky_top    = "#07202f"
sky_bottom = "#8fb0b6"
fog_near   = 2.0
fog_far    = 22.0
slots = ["#e6ece6", "#c8d6d2", "#3f5a63", "#e4c268", "#152c3c", "#f6fbe9", "#4bb3c9", "#b98b6a"]

[library]
# Библиотека Сна: тёплый полумрак. Камень — старая бумага, стены — тёмный орех,
# акцент — лампа. Самый тихий регион: контраст ниже, тени длиннее.
sky_top    = "#160f1f"
sky_bottom = "#6d6072"
fog_near   = 1.0
fog_far    = 18.0
slots = ["#e8ddc8", "#cbbda8", "#4a3a3a", "#d9a05b", "#241c30", "#f7ecd2", "#6b8ba8", "#a4707f"]

[gray]
# Серый финал: мир без взгляда. Цвет уходит почти полностью, остаётся холодный камень
# и единственное тёплое пятно — само Око.
sky_top    = "#141821"
sky_bottom = "#8d939c"
fog_near   = 2.0
fog_far    = 26.0
slots = ["#dfe1e4", "#c2c5c9", "#565b66", "#c8c3b4", "#2a2e38", "#eef0f2", "#93a0a6", "#b5b5b5"]
