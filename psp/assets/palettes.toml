# Палитры регионов. Цвета — "#rrggbb". Слоты: 0 верх, 1 верх-вариант, 2 стены, 3 акцент,
# 4 тень, 5 свечение глаза, 6 вода, 7 запас. Туман — в цвет sky_bottom; fog_near/fog_far —
# смещения глубины относительно цели камеры (0 = плоскость острова, минус — ближе к камере).
# Ключ к «дорогому» виду: большой разрыв светлоты между верхом (почти белый) и стенами
# (средний тон), глубокая холодная тень и акцент, которого мало.
# Компилируется в build/assets/palettes.pal (tools/mkassets.py).

[hub]
# Веко: сумерки. Небо — глубокий индиго вверху и пыльная роза у горизонта (он же цвет тумана).
# Камень тёплый, почти белый сверху; стены уходят в холодный серо-лиловый — тёплый свет,
# холодная тень. Акцент (золото) носят только Око, хвост и рычаги.
sky_top    = "#0d1430"
sky_bottom = "#b3a0a8"
fog_near   = 2.0
fog_far    = 22.0
slots = ["#f8f2e4", "#dcd8d2", "#6b5766", "#ffa22e", "#211f38", "#fff2cf", "#68a0c2", "#c4707c"]

[mirrors]
# Сад Зеркал: закатное тепло. Камень тёплый, стены — тёмная слива, акцент — золото луча.
sky_top    = "#2a1430"
sky_bottom = "#bc8c79"
fog_near   = 2.0
fog_far    = 22.0
slots = ["#fbf1e0", "#e0d5cb", "#79545f", "#ffc94e", "#2c1d3a", "#fff6d8", "#7fb2c9", "#e07a8a"]

[terraces]
# Часовые Террасы: холодное утро. Камень белёсый, стены — синий сланец, акцент — латунь.
sky_top    = "#0c1e36"
sky_bottom = "#a3b2b4"
fog_near   = 2.0
fog_far    = 22.0
slots = ["#f2f4ee", "#d2d8d3", "#566370", "#f5b544", "#1c2739", "#fdf3cf", "#79a8bf", "#c2766b"]

[water]
# Тихая Вода: светящаяся бирюза. Камень холодный, стены — глубокий сине-зелёный.
sky_top    = "#07202f"
sky_bottom = "#95b5b8"
fog_near   = 2.0
fog_far    = 20.0
slots = ["#eef5f2", "#cbdbd9", "#47616a", "#ecc766", "#12303c", "#f6fbe9", "#4f93b4", "#b98b6a"]

[library]
# Библиотека Сна: тишина и фиолет. Самый тёмный регион, туман ближе всех.
sky_top    = "#150f22"
sky_bottom = "#837484"
fog_near   = 1.0
fog_far    = 17.0
slots = ["#ece5d8", "#cdc5c2", "#4d4255", "#e3a959", "#1a1426", "#f7ecd2", "#6b8ba8", "#a4707f"]

[gray]
# Обесцвеченный финал: та же структура светлот, но цвета из неё вынуты.
sky_top    = "#15181f"
sky_bottom = "#9aa0a6"
fog_near   = 2.0
fog_far    = 22.0
slots = ["#f0f0ef", "#d4d4d4", "#595b62", "#c8c8c8", "#202430", "#f2f2f2", "#93a0a6", "#b5b5b5"]
