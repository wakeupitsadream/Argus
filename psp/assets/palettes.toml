# Палитры регионов. Цвета — "#rrggbb". Слоты: 0 верх, 1 верх-вариант, 2 стены, 3 акцент,
# 4 тень, 5 свечение глаза, 6 вода, 7 запас. Туман — в цвет sky_bottom; fog_near/fog_far —
# смещения глубины относительно цели камеры (0 = плоскость острова, минус — ближе к камере).
#
# Свет цветной: sun — прямой (тёплый), sky — заливка (холодная). core/mesh.c умножает
# цвет материала на цвет света, поэтому освещённая грань уходит в тепло, а тень — в синеву,
# не теряя цвета камня. Слоты здесь — альбедо, то есть «цвет при белом свете»: они заметно
# светлее и насыщеннее, чем то, что видно в кадре. Ровно это отличает нарисованную сцену
# от набора серых кубиков; серая заливка была главной причиной «дешёвой» картинки.
#
# Рецепт, общий для всех регионов (светлота по Rec.601 после затенения из core/mesh.c):
#   верх ≈ 210, верх-вариант ≈ 180, стена на свету ≈ 65, стена в тени ≈ 28 — разрыв ≥ 3×.
# Верх тёплый песчаник, вариант верха холоднее: плита читается как один материал,
# а ступени и мосты — как другой. Стены — насыщенный тёмный тон, а не чёрный.
# Акцента в кадре мало: он достаётся только Око, перьям, глазам и механизмам.
# Туман начинается ЗА плоскостью камеры (fog_near > 0): передний план держит полный
# контраст, растворяется только дальняя половина острова.
# Компилируется в build/assets/palettes.pal (tools/mkassets.py).

[hub]
# Веко: сумерки. Небо — густой индиго вверху и тёплая роза у горизонта (он же цвет тумана).
# Камень — тёплый песчаник, стены — слива. Золото носят только Око, хвост, глаза
# и механизмы: акцента в кадре должно быть мало, иначе он перестаёт быть акцентом.
sky_top    = "#101a44"
sky_bottom = "#d98f7e"
sun        = "#ffdaa8"
sky        = "#93b4ee"
fog_near   = 3.0
fog_far    = 16.0
slots = ["#f2dcb4", "#d2b28c", "#7d5590", "#ffb43c", "#1b1740", "#fff0c6", "#4f9fd0", "#d4737f"]

[mirrors]
# Сад Зеркал: закат. Небесная заливка сиреневая — час, когда тени становятся лиловыми.
# Акцент тот же золотой: это цвет луча, и он обязан читаться как источник.
sky_top    = "#34123c"
sky_bottom = "#e08a63"
sun        = "#ffd9a0"
sky        = "#b48ce0"
fog_near   = 2.0
fog_far    = 17.0
slots = ["#f6dcbe", "#d9ab8c", "#964a78", "#ffcb5c", "#35163f", "#fff3d2", "#6fb2c9", "#ef7f88"]

[terraces]
# Часовые Террасы: холодное утро. Камень серо-зелёный, стены — сталь, акцент — латунь
# на механизмах. Здесь всё про движение, поэтому цвет спокойный, а свет резкий.
sky_top    = "#102c55"
sky_bottom = "#eecfa4"
sun        = "#fff0d0"
sky        = "#7fb0f0"
fog_near   = 2.0
fog_far    = 18.0
slots = ["#e9eee0", "#b6c6ae", "#41627a", "#ffb43a", "#16304a", "#fdf3cf", "#79a8bf", "#c2766b"]

[water]
# Тихая Вода: бирюза и песок. Вода — единственный насыщенный цвет региона,
# поэтому слот воды яркий, а камень выцветший.
sky_top    = "#052a48"
sky_bottom = "#c2ecdc"
sun        = "#fff2d8"
sky        = "#74c8e8"
fog_near   = 3.0
fog_far    = 16.0
slots = ["#edf3ea", "#bcd4cd", "#3c7288", "#ffc85c", "#0d3448", "#f6fbe9", "#2fc2dc", "#b98b6a"]

[library]
# Библиотека Сна: тёплый полумрак. Камень — старая бумага, стены — тёмный орех,
# акцент — лампа. Самый тихий регион: контраст ниже, тени длиннее.
sky_top    = "#1b0f24"
sky_bottom = "#7e5f6c"
sun        = "#ffd79a"
sky        = "#8f7fc0"
fog_near   = 1.0
fog_far    = 13.0
slots = ["#efdcc0", "#c6ab90", "#6a4757", "#ffb45e", "#251a34", "#f7ecd2", "#6b8ba8", "#a4707f"]

[gray]
# Серый финал: мир без взгляда. Цвет уходит и из материала, и из света —
# рядом с остальными регионами это читается сразу.
sky_top    = "#141821"
sky_bottom = "#9aa0a8"
sun        = "#e8eaee"
sky        = "#c0c6d0"
fog_near   = 2.0
fog_far    = 26.0
slots = ["#dfe1e4", "#c2c5c9", "#6e737e", "#c8c3b4", "#2a2e38", "#eef0f2", "#93a0a6", "#b5b5b5"]

[dawn]
# Финал А: Аргус открыл глаза. Рассвет — единственное место в игре, где небо тёплое
# сверху донизу, а заливка розовая. Палитра включается только в финальной сцене.
sky_top    = "#3f2a54"
sky_bottom = "#ffc08c"
sun        = "#ffe2b4"
sky        = "#c9a6e8"
fog_near   = 3.0
fog_far    = 28.0
slots = ["#fbeccb", "#e8d4ae", "#9c6a78", "#ffc65a", "#2d2340", "#fff6dc", "#8fc0d6", "#d98f74"]
