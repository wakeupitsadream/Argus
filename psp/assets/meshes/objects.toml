# objects.toml — параметры процедурной геометрии объектов ARGUS.
# Сборка: python3 tools/meshgen.py build/assets  →  build/assets/mesh_<имя>.msh (формат AMSH,
# docs/FORMATS.md). Имена файлов совпадают с MESH_FILES в core/game.c, порядок здесь не важен.
# Правки габаритов и числа сегментов делаются здесь, в meshgen.py — только построение.
#
# Соглашения:
#   * масштаб: клетка уровня = 1.0, шаг высоты 0.5;
#   * «лицо» объекта смотрит в +Z — так его понимает core/player.c (радужка выносится вперёд на
#     (sin yaw, cos yaw)) и так ракурс 0 камеры (yaw 45°) видит лицо, а не затылок;
#   * по умолчанию объект стоит на полу: низ bbox прижимается к lift (0 — пол), начало
#     координат — центр основания. ground = false отключает прижатие: нужно там, где важен
#     собственный центр (голова и радужка Око, ступица павлиньего хвоста);
#   * слоты палитры: 0 верх, 1 верх-вариант, 2 стены, 3 акцент, 4 тень, 5 свечение, 6 вода, 7 запас;
#   * ao — запечённое затенение вершины 0..255, цвет считает игра (mesh_recolor);
#   * expect — заявленные габариты (размеры bbox) для самопроверки `--check`, tol — допуск
#     (доля, по умолчанию 0.12): у гранёных форм ширина меньше диаметра на cos(180/sides);
#   * у пера (fan) tip_frac — доля длины от самого широкого места до кончика;
#   * budget — бюджет треугольников (CLAUDE.md п.17): объект ≤ 400, eye_* и мелочь ≤ 120.
#
# Типы частей (part.type) и их параметры перечислены в шапке tools/meshgen.py.

# --- общие формы, на которые ссылаются части через use = "<имя>" ---

# Одно перо павлиньего хвоста. Ступица веера — в начале координат, перо смотрит лицом в +Z,
# кончик («глаз» пера) — слот свечения. Перо номер i в раскрытом хвосте получается поворотом
# вокруг оси Z на угол a_i = arc_deg·(i/(count-1) - 0.5), i = 0..count-1.
[shape.tail_fan]
type = "fan"
center = [0.0, 0.0, 0.0]
count = 24
arc_deg = 160.0
inner_r = 0.34
length = 1.26
half_wid = 0.095
thick = 0.05
segs = 8
tip_frac = 0.36
bow = 0.34
slot = 3
slot_tip = 5
ao = 240
ao_tip = 255

# --- Око (игрок): тело + голова + радужка ---

# Тело: усечённый цилиндр, стоит на полу. core/player.c ставит его в точку игрока.
# Слот тени, а не акцента: верх острова почти белый, и белое Око на нём исчезало.
# Тёмное тело под светлой головой — силуэт, читаемый на любом полу.
[[object]]
name = "eye_body"
budget = 120
expect = { width = 0.32, height = 0.55, depth = 0.32 }
[[object.part]]
type = "prism"
center = [0.0, 0.0, 0.0]
radius = 0.16
radius_top = 0.13
height = 0.55
sides = 12
slot = 4
ao_top = 255
ao_side = 228
ao_bottom = 170

# Голова: приплюснутая сфера, ЦЕНТР в начале координат — player.c поднимает её на BODY_H
# (0.55 = высота тела до центра головы) и туда же, вперёд на 0.16, ставит радужку.
[[object]]
name = "eye_head"
ground = false
budget = 120
expect = { width = 0.40, height = 0.34, depth = 0.40 }
[[object.part]]
type = "sphere"
center = [0.0, 0.0, 0.0]
radius = 0.2
segs = 10
rings = 5
squash = 0.85
slot = 5
ao_top = 255
ao_bottom = 195

# Радужка — ЗРАЧОК, а не свечение: слот тени. Светлая радужка на почти белой голове
# сливалась с ней, и Око читалось безликим пятном. Тёмный диск на светлой голове —
# это глаз с первого кадра; блик в нём рисует спрайт из core/player.c.
# Радужка: линза, центр в начале координат. Радиус 0.12 при выносе 0.16 и радиусе головы 0.2
# даёт обод точно на поверхности головы (0.12² + 0.16² = 0.2²), наружу торчит только линза.
# По вертикали радужка сплюснута тем же squash 0.85 (0.12·0.85 = 0.102) — тогда обод лежит
# на приплюснутом эллипсоиде головы при любом угле, а не протыкает его сверху и снизу.
[[object]]
name = "eye_iris"
ground = false
budget = 120
expect = { width = 0.24, height = 0.204, depth = 0.05 }
[[object.part]]
type = "lens"
center = [0.0, 0.0, 0.0]
face = "z"
along = "y"
r_len = 0.102
r_wid = 0.12
thick = 0.05
segs = 12
slot = 4
ao = 255

