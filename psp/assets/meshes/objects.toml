# --- павлиний хвост ---

# Раскрытый хвост: 24 пера по дуге 160°, ступица (центр веера) — в начале координат,
# основание — отдельный постамент mesh_plinth. ground = false, чтобы ступица не сдвигалась:
# только тогда одиночное перо, повёрнутое вокруг Z, встаёт ровно в своё место.
[[object]]
name = "peacock_tail"
ground = false
budget = 400
expect = { width = 2.98, height = 1.56, depth = 0.54 }
[[object.part]]
use = "tail_fan"

# Одно перо в «нулевой» позе веера (смотрит вверх, лицом в +Z) — из них игра собирает хвост
