# Мини-квесты отголосков (GDD §1.4 п.6): шесть просьб «принести, зажечь, найти».
# Награда за каждую — перо (world_t.feathers), перья открывают бонусный остров и второй финал.
# Квесты необязательны и не блокируют прохождение.
#
# Сборка: python3 tools/questgen.py build/assets → build/assets/quests_data.h
# (таблица `static const quest_def_t QUESTS[]` и `#define QUEST_COUNT`).
# Состояние квеста нигде не хранится: оно выводится из флагов мира (core/quest.c).
#
# Поля [[quest]] (все обязательны, лишних ключей быть не должно):
#   name        — служебное имя, попадает только в комментарий сгенерированного заголовка
#   giver       — id сущности-отголоска (ENT_ECHO) на уровне; 1..199, уникален по всей таблице
#   need_flag   — id сущности, сбор или активация которой и есть выполнение просьбы (флаг 1..199)
#   accept_flag — глобальный флаг «просьба принята» (204..255)
#   reward_flag — глобальный флаг «просьба закрыта, перо выдано» (204..255)
#   str_offer / str_progress / str_done — идентификаторы строк из assets/strings.csv без STR_
#
# Распределение id сущностей по островам. Флаги мира 1..199 — общие для всей игры
# (core/world.h), поэтому одинаковые id на разных островах делили бы один флаг:
#   хаб «Веко»        1..49
#   Сад Зеркал       50..79
#   Часовые Террасы  80..109
#   Тихая Вода      110..139
#   Библиотека Сна  140..169
#   бонусный остров 170..189
# Глобальные флаги: 200..203 заняты WFLAG_* (core/world.h), квесты берут по два подряд
# из 208..219 — для квеста N (1..6): accept = 206 + 2·N, reward = 207 + 2·N.
#
# Строки регионов лежат во фрагментах assets/strings/<регион>.csv; квесты островов,
# которые ещё не собраны, ссылаются на будущие id отголосков и молчат, пока такой
# сущности нет в игре (quest_find просто не находит дарителя).

# --- хаб «Веко»: два отголоска у площадки (levels/hub.toml, id 10 и 11) ---

[[quest]]
name = "hub_east_eye"
giver = 10
need_flag = 30
accept_flag = 208
reward_flag = 209
str_offer = "ECHO_1"
str_progress = "ECHO_2"
str_done = "ECHO_3"

[[quest]]
name = "hub_west_eye"
giver = 11
need_flag = 31
accept_flag = 210
reward_flag = 211
str_offer = "ECHO_1"
str_progress = "ECHO_2"
str_done = "ECHO_3"

