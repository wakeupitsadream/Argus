# Бонусный остров: награда за просьбы отголосков. Ход сюда открывают три пера
# (BONUS_FEATHERS в core/game.c), головоломок здесь нет — только вид и четыре глаза.
#
# ПОЧЕМУ ТАК. Все острова игры прямоугольные: так устроена карта высот. Этот —
# единственный круглый, собран кольцами по радиусу. Силуэт не спутать ни с чем,
# и по нему сразу видно, что игрок попал в место, куда ведёт не сюжет, а
# любопытство. Подниматься можно с любой стороны: ступень в полшага берётся без
# лестниц, поэтому кольца проходимы целиком (PLAYER_STEP_MAX в core/player.c).
# id сущностей 170..189 — диапазон бонусного острова (docs/CONTENT.md).
