# --- стражи коридора ---

# params: радиус в десятых клетки, скорость в град/с. Коридор шириной в одну клетку,
# радиус 0,9 — страж то встаёт поперёк прохода, то уходит с него в пустоту по сторонам.
# Проход не запирается навсегда: без взгляда страж не останавливается никогда,
# а третий параметр — начальная фаза, чтобы стражи не ходили ноздря в ноздрю.
[[entity]]
type = "SLEEPER"
id = 151
cell = [6.5, 10.5]
params = [9, 24, 96]

[[entity]]
