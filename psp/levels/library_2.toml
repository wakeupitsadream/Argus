# Библиотека Сна, остров 2: большой глаз региона.
# Финал собирает два семейства: взгляд (спящие стражи) и память (постаменты и панель).
#
# ПОЧЕМУ ТАК. Коридор в две клетки шириной перекрывают два стража. Они ходят по
# кругу, пока на них не смотрят, и занимают клетку как камень (core/entity.c,
# ent_refresh_blockers). Держишь круг — они замирают, и мимо застывшего можно
# пройти. Это первое место в игре, где взгляд решает задачу, а не показывает
# скрытое, и единственный способ попасть в зал.
# В зале три постамента подают в панель свои значения: 2, 3 и 1. Порядок не
# написан нигде — панель сбрасывается на ошибке и звенит, перебор стоит секунд
# десять и запоминается навсегда. Собранная последовательность открывает глаз.
# id сущностей 150..159 — хвост диапазона региона (140..169).
name = "library_2"
palette = "library"
cell = 1.0
step = 0.5
base_depth = 2.6
cam_angle = 0
cam_lock = false
spawn = [2.5, 10.5]
spawn_yaw = 90.0
caption = "LIBRARY_2_CAPTION"

# Высоты: причал 3, коридор и зал 4. Коридор нарочно в одну клетку: разойтись
# со стражем боком нельзя, и взгляд перестаёт быть украшением.
