# Сад Зеркал, первый остров: правило вводится простейшим экземпляром (GDD §1.2).
# Луч идёт с севера, одно зеркало поворачивает его на восток в приёмник, приёмник
# открывает дверь к порталу. Дверь физически запирает клетку через сегмент 1
# (docs/FORMATS.md, «Двери»), иначе игрок прошёл бы мимо головоломки.
# id сущностей 50..79 — диапазон региона (docs/CONTENT.md).
name = "mirrors_1"
palette = "mirrors"
cell = 1.0
step = 0.5
base_depth = 1.6
cam_angle = 0
cam_lock = false
spawn = [3.5, 9.5]
spawn_yaw = 90.0
caption = "MIRRORS_1_CAPTION"

map = """
....................
....................
....................
...........444......
...........444......
.......33333333.....
.......33333333.....
.......33333333.....
..4444.33333333.....
..4444333333333.....
..44443333333334444.
..4444.33333333.....
.......33333333.....
.......33333333.....
.......33333333.....
........22..........
........22..........
........22..........
....................
....................
"""

