# --- точка прибытия с хаба ---

[[entity]]
type = "SPAWN"
id = 50
cell = [3.5, 9.5]
yaw = 90.0

# --- головоломка: излучатель → зеркало → приёмник → дверь ---

# Излучатель на северном краю двора, луч идёт на юг (yaw 0 = +Z).
[[entity]]
type = "EMITTER"
id = 53
cell = [10.5, 5.5]
yaw = 0.0

# Зеркало стоит «не той стороной»: в состоянии 0 луч с севера гаснет.
# Один поворот крестом переводит его в состояние 1 — луч уходит на восток.
[[entity]]
type = "MIRROR"
id = 54
cell = [10.5, 11.5]
yaw = 0.0

[[entity]]
type = "RECEIVER"
id = 55
cell = [14.5, 11.5]
yaw = 270.0

[[entity]]
type = "DOOR"
id = 56
cell = [15.5, 10.5]
yaw = 90.0
params = [1]          # номер сегмента, который открывает дверь

[[link]]
from = [55, 0]
to = [56, 0]

# Точка прибытия с mirrors_2: восточный коридор, а не вход с хаба.
[[entity]]
