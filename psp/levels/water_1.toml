# Тихая Вода, остров 1: «Пристань». Семейство шлюзов вводится простейшим экземпляром
# (GDD §1.2): у острова одно колесо и ровно два уровня воды, и от уровня зависит,
# какой из двух плотов лежит вровень с берегом.
#
#   вода 1 (стартовая) — северный БРОД: настил высоты 1 лежит вровень с гладью,
#       оба его берега срезаны до высоты 0, перепад 0,5 — пройти можно;
#       понтон в это время на 1,0 ниже причалов и недосягаем;
#   вода 2 — южный ПОНТОН: настил высоты 2 всплывает под причальную кромку
#       высоты 3, а брод уходит на 1,0 вниз и закрывается.
#
# Арифметика, которую стоит держать в голове при правках: пол плавучей клетки равен
# water_steps × step (core/walk.c), шаг персонажа — 0,55. Берег высоты H пускает
# на плот, пока |water_steps − H| ≤ 1, поэтому берег 0 открывает только воду 1,
# а кромка 3 — только воду 2. Так один остров при разной воде даёт разные маршруты.
#
# Перемычка шлюза (высота 6) перегораживает канал между бродом и понтоном: она же
# объясняет, откуда у воды два уровня, и держит силуэт середины острова.
# Вторая головоломка — сокобан: блок 119 едет на восток на плиту 117, плита
# открывает ворота 120 (сегмент 1) к порталу на water_2.
# id сущностей 110..139 — диапазон региона (docs/CONTENT.md); точка входа с хаба — 110.
