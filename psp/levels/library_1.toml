# Библиотека Сна, остров 1: семейство памяти вводится простейшим экземпляром.
# Зал со стеллажами, в дальнем торце — панель. Нажатие по самой панели подаёт
# следующее значение по порядку (docs/FORMATS.md, «Панель памяти»), поэтому
# последовательность 1,2,3,4 собирается четырьмя нажатиями: правило объясняет
# сама вещь, без единой строки туториала (GDD §1.2).
#
# ПОЧЕМУ ТАК. Настоящая головоломка на память — на втором острове, где значения
# подают постаменты и порядок надо запомнить. Здесь задача одна: показать, что
# панель считает нажатия и сбрасывается на ошибке.
# Спящий страж ходит по залу и занимает клетку: под взглядом он замирает
# (core/entity.c, ent_refresh_blockers) — это первая встреча с механикой взгляда
# как с препятствием, а не с украшением.
# id сущностей 140..149 — голова диапазона региона (140..169).
name = "library_1"
palette = "library"
cell = 1.0
step = 0.5
base_depth = 2.6
cam_angle = 0
cam_lock = false
spawn = [2.5, 10.5]
