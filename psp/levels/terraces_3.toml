# Часовые Террасы, остров 3: большой глаз региона.
# Финал региона собирает два семейства (docs/CONTENT.md): вращение сегментов и
# рычаг с дверью. Маршрут читается с первого взгляда — четыре площадки в ряд, между
# ними два поворотных рукава, за ними башня с глазом.
#
# ПОЧЕМУ ТАК. Рукав живёт двумя наборами клеток: рабочим (мост на восток) и покоем
# (тот же камень, развёрнутый в сторону). Проходим всегда ровно один — тот, чьё
# состояние совпало с seg_states. В кадре это видно буквально: плита неактивного
# набора утоплена в пол (GAME_SEG_DROP в core/game.h), активная стоит вровень.
# Рукояти стоят на площадках, а не на самих рукавах: повернуть камень из-под
# собственных ног запрещает segment_would_trap в core/puzzle_mech.c.
# id сущностей 100..109 — хвост диапазона региона (80..109).
name = "terraces_3"
palette = "terraces"
cell = 1.0
step = 0.5
