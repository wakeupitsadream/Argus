# Веко — хаб. Карта высот: '.' пусто, 0-9/a-f — высота в шагах step (0,5 ед.).
# Ось x — вправо по строке, ось z — вниз по строкам; остров центрируется в (0, 0).
# Силуэт строится на одной большой форме и немногих акцентах: плита 4 занимает почти весь
# остров, в неё врезаны площадка 6 со ступенью 5 и монумент — основание 8 и столп 11
# с постаментом; на монумент не подняться (два шага), он читается как памятник, а не путь.
# На диагоналях площадки — четыре сквозных колодца, по срезам восьмиугольника висят
# четыре полки 3 с малыми глазами. По осям: губа 3, плечо 2, мост 1 над пустотой
# (две клетки в ширину и две в длину) и площадка портала 2.
# Формат — docs/FORMATS.md, «Исходник уровня»; собирается tools/levelc.py.
name = "hub"
palette = "hub"
cell = 1.0
step = 0.5
base_depth = 1.8   # подошва: острову нужна масса, но не тумба
cam_angle = 0
cam_lock = false
spawn = [12.0, 20.5]   # на южном мосту, лицом к центру
spawn_yaw = 180.0
caption = "HUB_CAPTION"

map = """
..........2222..........
..........2222..........
...........11...........
...........11...........
..........2222..........
.........333333.........
......33.444444.33......
......334444444433......
.......4.555555.4.......
.....34456666665443.....
22..2344568888654432..22
22112344568bb86544321122
22112344568bb86544321122
22..2344568888654432..22
.....34456666665443.....
.......4.555555.4.......
......334444444433......
......33.444444.33......
.........333333.........
..........2222..........
...........11...........
...........11...........
..........2222..........
..........2222..........
"""

