# Часовые Террасы, остров 1: семейство вращения вводится простейшим экземпляром (GDD §1.2).
# Посреди двора стоит круглая ступица с часовой стрелкой — сегмент 1. Стрелка держит
# ровно одно направление за раз: север (состояние 0), восток (1), юг (2). Рычаг на
# северном уступе открывает ворота, восточная стрелка ведёт к ним.
#
# ПОЧЕМУ ТАК. Поворот из-под ног запрещён (segment_would_trap в core/puzzle_mech.c),
# поэтому ступица 3×3 — статичный камень, а рукоять стоит в её середине: до ближайшей
# клетки стрелки ровно 1,5 — больше, чем длина руки (INTERACT_REACH = 1,1). Стоя на
# стрелке, повернуть её нельзя физически.
# id сущностей 80..109 — диапазон региона (docs/CONTENT.md).
name = "terraces_1"
palette = "terraces"
cell = 1.0
step = 0.5
base_depth = 3.2
cam_angle = 0
cam_lock = false
spawn = [2.5, 11.5]
spawn_yaw = 90.0
caption = "TERRACES_1_CAPTION"

