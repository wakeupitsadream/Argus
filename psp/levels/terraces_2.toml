# Часовые Террасы, остров 2: невозможная геометрия и башня с лестницей.
#
# РАКУРС ЗАБЛОКИРОВАН (cam_lock). Всё держится на одном свойстве ортографической
# изометрии: при ракурсе 0 (yaw 45°, наклон 30°) точка, отодвинутая на 2 клетки по x,
# на 3 по z и опущенная на 4 шага, попадает ровно в ту же точку экрана, что и «следующая
# ступень» настоящей лестницы. Поэтому висящий в стороне пролёт (z = 2..3, высоты 3-4-5-6)
# читается как продолжение пролёта у северного уступа (z = 6..7, высоты 4-5-6-7).
# Глаз видит одну лестницу, нога упирается в пустоту — про это и камень TERRACES_STONE_2.
#
# Настоящий путь наверх — башня: её лестница (сегмент 2) повёрнута прочь и становится
# проходимой только после поворота рукояти на площадке. Наверху блок и плита открывают
# ворота к малому глазу 88 (цель просьбы отголоска 81 с первого острова) и порталу дальше.
#
# Рукояти стоят в середине статичных площадок 3×3: до ближайшей клетки сегмента 1,5 —
# больше длины руки (1,1), поэтому повернуть сегмент из-под собственных ног нельзя.
