# Тихая Вода, остров 2: «Затон». Большой глаз региона.
# Здесь семейство складывается: сначала сухой сокобан отпирает ворота, за воротами
# стоит колесо с тремя уровнями, и только на верхнем понтон всплывает вровень
# с причалами. По всплывшему понтону блок переезжает воду и ложится на плиту
# перед постаментом — плита будит большой глаз.
#
#   вода 1 (стартовая) и вода 2 — понтон лежит ниже причалов на 1,0 и 0,5·... ,
#       точнее: пол плота = water_steps × step = 0,5 и 1,0 при причалах 2,0 —
#       перепад 1,5 и 1,0, шаг персонажа 0,55, пройти нельзя;
#   вода 3 — пол плота 1,5, перепад 0,5: понтон открыт.
# Колесо (params = [1, 3]) идёт 1 → 2 → 3 → 1, то есть «повернуть дважды».
#
# id сущностей 110..139 — диапазон региона (docs/CONTENT.md).
